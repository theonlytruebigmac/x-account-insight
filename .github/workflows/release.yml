name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:build
      - run: npm run lint:firefox
      - run: npx playwright install --with-deps chromium
      - run: npm run check:e2e
      - run: npm run package

      # Firefox self-distribution: signs the build with Mozilla so Firefox can
      # install it permanently (not just "temporary add-on") and so the
      # update_url below can serve real, silent auto-updates. No-ops entirely
      # until AMO_JWT_ISSUER/AMO_JWT_SECRET secrets are added to this repo —
      # get them for free from https://addons.mozilla.org/developers/addon/api/key/
      - name: Sign Firefox build with AMO (optional)
        id: sign_firefox
        if: startsWith(github.ref, 'refs/tags/') && secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != ''
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npm run sign:firefox
          signed=$(ls dist/*.xpi | head -n1)
          version="${GITHUB_REF_NAME#v}"
          renamed="dist/x-account-insight-firefox-v${version}.xpi"
          mv "$signed" "$renamed"
          echo "xpi_path=extension/${renamed}" >> "$GITHUB_OUTPUT"

      # Publishes the version/download/hash that manifest.firefox.json's
      # update_url points at, so installed copies discover this release.
      # Only runs right after a successful sign above (so never on a repo
      # without AMO secrets configured). Commits straight to main.
      - name: Publish Firefox self-update manifest
        if: steps.sign_firefox.outcome == 'success'
        working-directory: .
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          xpi_path="${{ steps.sign_firefox.outputs.xpi_path }}"
          hash="sha256:$(sha256sum "$xpi_path" | cut -d' ' -f1)"
          download_url="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/$(basename "$xpi_path")"
          cat > /tmp/updates.json <<JSON
          {
            "addons": {
              "x-account-insight@local": {
                "updates": [
                  {
                    "version": "${version}",
                    "update_link": "${download_url}",
                    "update_hash": "${hash}",
                    "applications": { "gecko": { "strict_min_version": "140.0" } }
                  }
                ]
              }
            }
          }
          JSON
          git fetch origin main
          git worktree add /tmp/main-worktree origin/main
          cp /tmp/updates.json /tmp/main-worktree/updates.json
          cd /tmp/main-worktree
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git diff --cached --quiet && echo "No changes to updates.json" && exit 0
          git commit -m "Publish Firefox self-update manifest for ${GITHUB_REF_NAME}"
          git push origin HEAD:main

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: extension-builds
          path: |
            extension/dist/*.zip
            extension/dist/*.xpi

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            extension/dist/*.zip
            extension/dist/*.xpi
          generate_release_notes: true
